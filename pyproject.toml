[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ws2000-weather-api"
version = "0.1.0"
description = "Recepção local de observações meteorológicas Ambient Weather"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "swagger-ui-bundle-v2>=5.31,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
